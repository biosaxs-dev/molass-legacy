[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "molass_legacy"
version = "1.6.18"

dependencies = [
  "numpy",
  "scipy",
  "matplotlib",
  "pybaselines>=1.2.0",
  "molass>=1.0.3",
  "statsmodels>=0.14.5",
  "scikit-learn",
  "toml",
  "psutil",
  "python-tkdnd",
  "screeninfo",
  "lmfit",
  "seaborn",
  "openpyxl<=3.1.3",
  "pyperclip",
  "wmi",
  "numba",
  "termcolor",
  "tksheet",
  "ipywidgets",
]

requires-python = ">=3.9,<3.15"

authors = [
  {name = "Molass Community"},
]

maintainers = [
  {name = "Molass Community"}
]

description = "Matrix Optimization with Low-rank factorization for Automated analysis of SEC-SAXS"
readme = "README.md"
license = { text = "GNU General Public License v3.0" }

keywords = ["SEC-SAXS"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
]

[project.optional-dependencies]
excel = [
  "pywin32"
]
# Only needed for the 'NS' (nested sampling) solver option; ships Cython
# extensions that may lack prebuilt wheels for very new Python versions,
# requiring a C++ compiler to build from source. Install with:
#   pip install molass_legacy[ultranest]
ultranest = [
  "ultranest"
]
# Only needed by the manual GuinierTools/Alsaker2017.py dev tool (not on any
# default pipeline path). Install with: pip install molass_legacy[alsaker]
alsaker = [
  "ruptures"
]

[project.scripts]
molass = "molass_legacy.molass:gui_main"

[project.urls]
Repository = "https://github.com/biosaxs-dev/molass-legacy"